[package]
name = "elementsd-tests"
version = "0.1.0"
authors = ["Andrew Poelstra <apoelstra@wpsoftware.net>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Must be the same fork/rev as the parent crate, else `bitcoin` types don't unify.
bitcoin = { git = "https://github.com/Blockstream/rust-bitcoin.git", branch = "use-secp256k1-0.33.1" }
elements = {path = "../", features = ["base64"]}
elementsd = "0.11.0"
rand = "0.9"

